name: Publish Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release for all repositories, for example 1.2.0
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.MIRROR_TOKEN }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Validate packages
        run: composer packages:validate

      - name: Create mirrors
        env:
          GH_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: composer mirrors:create

      - name: Sync mirror metadata
        env:
          GH_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: composer mirrors:sync

      - name: Split and release
        env:
          GH_TOKEN: ${{ secrets.MIRROR_TOKEN }}
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: composer release
